name: Pull Request CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# CI is deliberately AWS-independent. It must not receive AWS credentials or
# deploy infrastructure; AWS CD is owned by CodePipeline/CodeBuild in V4.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Terraform, Python, and security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: Check repository consistency and credentials
        run: python scripts/ci/check_repository_consistency.py

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize Terraform providers without a backend
        shell: bash
        run: |
          set -euo pipefail
          for root in \
            terraform/bootstrap/environments/dev \
            terraform/bootstrap/environments/prod \
            terraform/environments/dev \
            terraform/environments/prod \
            terraform/cicd-control \
            terraform/cicd-proof/dev \
            terraform/cicd-proof/prod; do
            terraform -chdir="$root" init -backend=false -input=false -no-color
          done

      - name: Validate Terraform environments
        shell: bash
        run: |
          set -euo pipefail
          for root in \
            terraform/bootstrap/environments/dev \
            terraform/bootstrap/environments/prod \
            terraform/environments/dev \
            terraform/environments/prod \
            terraform/cicd-control \
            terraform/cicd-proof/dev \
            terraform/cicd-proof/prod; do
            terraform -chdir="$root" validate -no-color
          done

      - name: Run focused unit and infrastructure tests
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q
          tests/data
          tests/infrastructure
          tests/ml
          tests/rag
